<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>林间婚礼请柬</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root { --title-border-img: url("./assets/border/title-border.png"); }

/* ===== 开场视频 ===== */
.intro-video-wrap {
  position: relative;
  width: 100%;
  background: #000;
}
.intro-video {
  display: block;
  width: 100%;
  height: auto;
}

html, body {
  width: 100%;
  min-height: 100vh;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Serif SC", serif;
  background: #1a2b1a;
  color: #f5e9c9;
}

/* ===== 整页森林背景 ===== */
.wrapper {
  position: relative;
  width: 100%;
  min-height: 100vh;
  background: url("./assets/bg/forest-bg.jpg") center top / cover no-repeat;
  padding: 16px 12px 0;
  overflow: hidden;
}

/* ===== 顶部 Hero 模块（仅保留 title-border.png 一层边框） ===== */
.hero {
  position: relative;
  margin-bottom: 14px;
  /* 移除 overflow: hidden，允许兔子/茶杯装饰探出边框 */
}

/* Hero 顶部小字行 */
.hero-top-row {
  position: absolute;
  top: 6%;
  left: 0;
  right: 0;
  z-index: 2;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0 16px;
}
.hero-small-title {
  color: #a8c68f;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
}
.hero-date {
  position: absolute;
  right: 16px;
  top: 0;
  color: #f5e9c9;
  font-size: 11px;
  letter-spacing: 1px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.55);
}

/* 大标题图片：绝对定位叠加在边框图上方 */
.hero-title-font {
  display: block;
  width: 82%;
  max-width: 340px;
  z-index: 2;
}

/* 标题金框：border-image 九宫格。
   素材 title-border.png 裁切后为 2196x1735，四角装饰（藤叶/兔子/茶杯钟）落在角区，
   中间只留纯金线细条用于拉伸，因此 hero 高度可随内容自由增长而装饰零变形。
   切片(px)：上 1000 / 右 896 / 下 695 / 左 1100
   s = 边框实际宽度 / 素材宽度，保证四角始终按原比例渲染 */
.hero-frame {
  --hw: calc(100vw - 24px);       /* wrapper 左右各 12px padding */
  --s:  calc(var(--hw) / 2196);
  border-style: solid;
  border-width: calc(1000*var(--s)) calc(896*var(--s)) calc(695*var(--s)) calc(1100*var(--s));
  border-image-source: var(--title-border-img);
  border-image-slice: 1000 896 695 1100;
  border-image-width: calc(1000*var(--s)) calc(896*var(--s)) calc(695*var(--s)) calc(1100*var(--s));
  border-image-repeat: stretch;
  z-index: 0;
  pointer-events: none;
}
/* 内容层：用负 margin 顶回金框的开口内（开口相对素材四边约留 150px）。
   这样内容仍在 .hero-frame 的流内 —— 内容一变高，金框就自动跟着拉长。 */
.hero-inner {
  margin: calc(-850*var(--s)) calc(-746*var(--s)) calc(-545*var(--s)) calc(-950*var(--s));
  min-height: calc(1435*var(--s));   /* 空内容时仍保持素材原始比例 */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* 兔子/茶杯装饰已集成进 title-border.png，无需单独元素 */

/* ===== 主内容面板 ===== */
.main-panel {
  position: relative;
  border: 1px solid rgba(222, 188, 120, 0.55);
  border-radius: 20px;
  background: rgba(16, 34, 18, 0.28);
  backdrop-filter: blur(2px);
  padding: 24px 14px 20px;
  margin-bottom: 14px;
}

/* 面板标题：◇ 林间的特别邀请 ◇ */
.panel-title {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #f3e5bd;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 4px;
  text-shadow: 0 1px 5px rgba(0,0,0,0.5);
  margin-bottom: 20px;
}
.panel-title::before,
.panel-title::after {
  content: "◇";
  font-size: 11px;
  color: rgba(222, 188, 120, 0.9);
}

/* ===== 照片轮播区域 ===== */
.photo-stage {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 28px;
  margin-bottom: 6px;
}
.photo-frame {
  position: relative;
  width: 30%;
  aspect-ratio: 3 / 4.4;
  border: 2px solid rgba(222, 188, 120, 0.9);
  outline: 1px solid rgba(222, 188, 120, 0.45);
  outline-offset: 3px;
  border-radius: 999px 999px 14px 14px;
  overflow: hidden;
  box-shadow: 0 6px 18px rgba(0,0,0,0.4), inset 0 0 20px rgba(255,215,130,0.12);
  opacity: 0.75;
  transform: scale(0.92);
  transition: all 0.35s ease;
  z-index: 2;
}
.photo-frame.active {
  opacity: 1;
  transform: scale(1.04);
  z-index: 3;
}
.photo-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* 轮播箭头 */
.carousel-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  border: none;
  background: transparent;
  color: #e8cf96;
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
  text-shadow: 0 1px 5px rgba(0,0,0,0.6);
  z-index: 4;
}
.carousel-arrow.prev { left: -2px; }
.carousel-arrow.next { right: -2px; }

/* 照片下方文字 */
.photo-sub-title {
  margin-top: -28px;
  position: relative;
  z-index: 3;
  text-align: center;
  color: #edc97e;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 3px;
  text-shadow: 0 2px 6px rgba(0,0,0,0.65);
}
.photo-desc {
  text-align: center;
  color: #f0e6c8;
  font-size: 12px;
  letter-spacing: 1px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.55);
  margin: 8px 0 20px;
}

/* ===== 信笺信息卡片（envlope 信封图片为背景） ===== */
.letter-card {
  position: relative;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 10px 26px rgba(0,0,0,0.38);
  margin: 0 -8px; /* 向左右扩展，让信封更大 */
}
/* 信封图在文档流内，完整显示不被截断 */
.envlope-decor {
  display: block;
  width: 100%;
  height: auto;
  pointer-events: none;
  z-index: 0;
  border-radius: 14px;
}
/* 文字内容覆盖在信封上方居中 */
.letter-content {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 4px 44px; /* 加大左右边距，确保分割线不超出信封 */
}
.letter-title {
  position: relative;
  color: #5a4632;
  font-family: "Songti SC", "Noto Serif SC", serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 3px;
  margin: 4px 0 10px;
  padding-bottom: 9px;
}
/* 主分割线：标题下方，醒目，两端渐隐，缩短避免触及信封留白 */
.letter-title::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 58%;
  height: 2px;
  background:
    linear-gradient(90deg, transparent, rgba(122, 88, 50, 0.75) 22%, rgba(122, 88, 50, 0.75) 78%, transparent);
  box-shadow: 0 3px 0 -1px rgba(122, 88, 50, 0.3);
}
.letter-row {
  position: relative;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: baseline;
  color: #5a4632;
  font-family: "Songti SC", "Noto Serif SC", serif;
  font-size: 15px;
  letter-spacing: 1px;
  padding: 6px 0;
}
/* 次分割线：伪元素居中，宽度缩短（68%），两端渐隐，不伸到留白处 */
.letter-row::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 68%;
  height: 1px;
  background:
    linear-gradient(90deg, transparent, rgba(160, 120, 60, 0.25) 15%, rgba(160, 120, 60, 0.25) 85%, transparent);
}
.letter-row .label {
  display: inline-block;
  min-width: 50px;
  margin-right: 8px;
  color: #a07c3c;
  font-size: 11px;
  letter-spacing: 2px;
  font-weight: 700;
}
.letter-btn {
  margin-top: 14px;
  padding: 8px 32px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(180deg, #eac470 0%, #c9963c 100%);
  color: #fff8ec;
  font-size: 13px;
  letter-spacing: 3px;
  box-shadow: 0 3px 10px rgba(160,110,30,0.45), inset 0 1px 0 rgba(255,255,255,0.4);
  cursor: pointer;
}
.letter-btn:active { transform: scale(0.96); }

/* ===== RSVP 回执区域 ===== */
.rsvp-container {
  display: none;
  margin-top: 16px;
  border: 1px solid rgba(222, 188, 120, 0.55);
  border-radius: 16px;
  overflow: hidden;
}
.rsvp-iframe {
  width: 100%;
  height: 600px;
  border: none;
  background: transparent;
}
.fallback-tip {
  display: none;
  text-align: center;
  margin-top: 12px;
  color: #f0e6c8;
  text-shadow: 0 1px 4px rgba(0,0,0,0.55);
}
.fallback-btn {
  margin-top: 10px;
  padding: 8px 26px;
  border-radius: 24px;
  border: none;
  background: #e6b268;
  color: #333;
}

/* ===== 底部导航（悬浮固定） ===== */
.bottom-nav {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 0;
  padding: 10px 18px;
  border: 1px solid rgba(222, 188, 120, 0.55);
  border-radius: 24px;
  background: rgba(16, 34, 18, 0.72);
  backdrop-filter: blur(6px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.nav-item {
  color: #f3e5bd;
  font-size: 14px;
  letter-spacing: 3px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.55);
  padding: 0 16px;
  cursor: pointer;
}
.nav-item + .nav-item { border-left: 1px solid rgba(222, 188, 120, 0.55); }
.nav-mark {
  color: rgba(222, 188, 120, 0.9);
  font-size: 10px;
  margin: 0 6px;
}

/* ===== 第二页：林间友人来信（复用第一页 hero / main-panel，信纸为独立卡片） ===== */
.page2 {
  position: relative;
  width: 100%;
  min-height: 100vh;
  background: url("./assets/bg/forest-bg.jpg") center top / cover no-repeat;
  padding: 16px 12px 80px; /* 底部留白给悬浮导航 */
}

/* 第二页 Hero 大标题（第一页用 title-font 字图，此处为文字版，叠加在边框图上） */
.p2-hero-title {
  z-index: 2;
  text-align: center;
  color: #f3e5bd;
  font-family: "Songti SC", "Noto Serif SC", serif;
  font-size: clamp(34px, 10.5vw, 44px);
  font-weight: 700;
  letter-spacing: 5px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  white-space: nowrap;
}

/* ===== 第二页：来信轮播组件 ===== */
.p2-carousel {
  position: relative;
  display: flex;
  align-items: center;
  gap: 0;
  background: transparent;
  padding: 8px 0;
}
/* 左侧椭圆头像框（金色双层光环） */
.p2-ellipse-avatar {
  position: relative;
  flex-shrink: 0;
  /* 随视口缩放：320px 屏约 83px，375px 及以上封顶 98px。
     高宽比 1.45，比原素材 88:116 更修长，贴近效果图。 */
  --ew: clamp(82px, 26vw, 98px);
  z-index: 1;              /* 贴近信纸时压在纸面之上 */
  margin-right: -6px;      /* 抵消素材左侧那圈「叠纸」留白，视觉上真正贴住 */
  width: var(--ew);
  height: calc(var(--ew) * 1.45);
}
.p2-ellipse-ring {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  border-radius: 50%;
  background: linear-gradient(145deg, #e8c96a, #c9a23a 50%, #a07d1e);
  box-shadow:
    0 0 16px rgba(232, 201, 106, 0.4),
    0 0 4px rgba(232, 201, 106, 0.2);
}
.p2-ellipse-ring-inner {
  position: absolute;
  top: 3px; left: 3px; right: 3px; bottom: 3px;
  border-radius: 50%;
  background: linear-gradient(145deg, #f5e3a0, #d4b455 50%, #b89530);
}
.p2-ellipse-img {
  position: absolute;
  top: 5px; left: 5px; right: 5px; bottom: 5px;
  width: calc(100% - 10px);
  height: calc(100% - 10px);
  border-radius: 50%;
  object-fit: cover;
  z-index: 1;
  border: 1px solid rgba(184, 149, 48, 0.5);
}
/* 右侧信纸卡片（背景使用信纸图素材） */
/* 信纸卡片：整张 envelope.png 素材当卡片背景（邮戳/金边/右下绿叶/背后叠纸都在素材里）。
   素材 1570x859 是横版，卡片却要竖着长，所以同样走 border-image 九宫格：
   切片(px) 上 240 / 右 339 / 下 458 / 左 419 —— 邮戳落在左上角区、绿叶落在右下角区，
   中间是纯纸面，纵向拉伸完全看不出来。fill 让中间纸面填进卡片内部。
   四边切片都按卡片自身宽度(cqw)换算，横竖同一缩放比例，素材零变形。 */
.p2-paper-card {
  flex: 1;
  min-width: 0;
  position: relative;
  container-type: inline-size;
  text-align: left;
}
.p2-paper-card::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  border-style: solid;
  border-width: 15.29cqw 21.59cqw 29.17cqw 26.69cqw;
  border-image: url("assets/border/envelope.png") 240 339 458 419 fill /
                15.29cqw 21.59cqw 29.17cqw 26.69cqw / 0 stretch;
}
/* 内容压在纸面之上 */
.p2-paper-header,
.p2-paper-body { position: relative; z-index: 1; }
/* 顶部信息栏：头像+名称居左，时间居右 */
.p2-paper-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  /* 上边距让开素材顶部的邮戳与花饰（= 上切片 15.29cqw 再加一点呼吸） */
  margin: calc(15.29cqw + 2px) 9cqw 8px;
}
.p2-paper-sender {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 0;   /* 允许收缩，姓名过长时才可能触发省略号 */
}
.p2-paper-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  border: 2px solid rgba(201, 181, 133, 0.9);
}
.p2-paper-name {
  color: #5a4632;
  font-family: "Songti SC", "Noto Serif SC", serif;
  font-size: clamp(13px, 4vw, 15px);
  font-weight: 700;
  letter-spacing: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;   /* 极窄屏/超长昵称时截断，绝不再压到时间上 */
  min-width: 0;
}
.p2-paper-time {
  color: #b3a077;
  font-family: "Songti SC", "Noto Serif SC", serif;
  font-size: clamp(11px, 3.2vw, 12px);
  letter-spacing: 1px;
  white-space: nowrap;
  flex-shrink: 0;
}
/* 窄屏（iPhone SE 等 ≤360px）：表头小圆头像与左栏椭圆头像是同一张图，
   此处省掉它，把这 34px 让给昵称，避免「月光猫头鹰 + 10分钟前」被截断。 */
@media (max-width: 360px) {
  .p2-paper-avatar { display: none; }
}

/* 正文区域 */
.p2-paper-body {
  display: grid;              /* 正文与撑高副本共用同一个网格单元 */
  align-content: start;       /* 正文顶对齐 */
  margin: 0 9cqw 6cqw;
  padding-top: 12px;
  border-top: 1px solid rgba(122, 88, 50, 0.12);
}
.p2-paper-body > .p2-paper-text { grid-area: 1 / 1; }
/* 撑高副本：由 JS 按 page2Letters 生成，只参与计算高度、不可见。
   于是卡片高度恒等于最长一封信，翻页时容器不跳动。 */
.p2-text-ghost {
  visibility: hidden;
  pointer-events: none;
}
.p2-paper-text {
  color: #5a4632;
  font-family: "Songti SC", "Noto Serif SC", serif;
  font-size: 15px;
  line-height: 1.85;
  letter-spacing: 0.5px;
}

/* 左右翻页箭头（金色圆形描边，半透明深绿底） */
.p2-arrow {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(30, 50, 30, 0.85);
  border: 1.5px solid rgba(206, 178, 117, 0.85);
  color: #e8c96a;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
  transition: background 0.2s;
}
.p2-arrow:active { opacity: 0.75; }

/* 翻页控制行：‹ ●●●● › */
.p2-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-top: 14px;
}

/* 底部圆点指示器 */
.p2-dots {
  display: flex;
  justify-content: center;
  gap: 8px;
}
.p2-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(206, 178, 117, 0.4);
  cursor: pointer;
  transition: all 0.25s;
}
.p2-dot.active {
  background: #e8c96a;
  box-shadow: 0 0 6px rgba(232, 201, 106, 0.5);
}

/* ===== 第三页：婚礼日程 ===== */
.page3 {
  position: relative;
  width: 100%;
  min-height: 100vh;
  background: url("./assets/bg/forest-bg.jpg") center top / cover no-repeat;
  padding: 16px 12px 80px;
}
/* 副标题：金色小字，位于面板标题之下 */
.p3-sub {
  text-align: center;
  color: #c8b88a;
  font-family: "Songti SC", "Noto Serif SC", serif;
  font-size: 13px;
  letter-spacing: 2px;
  margin: -8px 0 16px;
}
/* 日程列表 */
.p3-schedule {
  list-style: none;
  margin: 0;
  padding: 0 6px;
}
.p3-item {
  display: flex;
  align-items: baseline;
  justify-content: center;
  padding: 14px 0;
  border-bottom: 1px dashed rgba(222, 188, 120, 0.35);
  font-family: "Songti SC", "Noto Serif SC", serif;
}
.p3-item:last-child { border-bottom: none; }
.p3-time {
  color: #e8c96a;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 1px;
  margin-right: 16px;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
}
.p3-label {
  color: #f3e5bd;
  font-size: 15px;
  letter-spacing: 2px;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
}

/* ===== 第四页：登记祝福（报名/回执入口） ===== */
.page4 {
  position: relative;
  width: 100%;
  min-height: 100vh;
  background: url("./assets/bg/forest-bg.jpg") center top / cover no-repeat;
  padding: 16px 12px 80px;
}
/* 信纸卡：引导文案 + 问卷入口按钮 */
.p4-paper-card {
  background-color: #f2e8c9;
  background-image: url("assets/envelope/envlope.png");
  background-repeat: no-repeat;
  background-position: center;
  background-size: 135% 120%;
  border-radius: 14px;
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.38);
  padding: 28px 26px 30px;
  text-align: center;
}
.p4-guide {
  color: #5a4632;
  font-family: "Songti SC", "Noto Serif SC", serif;
  font-size: 15px;
  line-height: 2;
  letter-spacing: 0.5px;
  margin: 0 0 18px;
  text-align: left;
}
/* 底部金句 */
.p4-closing {
  text-align: center;
  color: #e8c96a;
  font-family: "Songti SC", "Noto Serif SC", serif;
  font-size: 14px;
  letter-spacing: 2px;
  margin-top: 22px;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
}
/* 内嵌问卷容器（覆盖 rsvp-container 默认隐藏） */
.p4-form-wrap {
  display: block;
  margin-top: 16px;
}
.p4-form-wrap .rsvp-iframe {
  min-height: 420px;
}

</style>
</head>
<body>
<!-- ===== 开场视频 ===== -->
<div class="intro-video-wrap">
  <video class="intro-video" id="js-intro-video" muted autoplay playsinline preload="auto">
    <source src="./assets/video/start.mp4" type="video/mp4">
  </video>
</div>

<div class="wrapper">

  <!-- ===== 顶部 Hero 模块 ===== -->
  <section class="hero">
    <div class="hero-frame" id="js-title-border">
      <div class="hero-inner">
        <img class="hero-title-font" id="js-title-font" alt="WEDDING INVITATION">
      </div>
    </div>
    <div class="hero-top-row">
      <span class="hero-small-title" id="js-top-small-title"></span>
      <span class="hero-date" id="js-top-date"></span>
    </div>
  </section>

  <!-- ===== 主内容面板 ===== -->
  <main class="main-panel">
    <h2 class="panel-title" id="js-card-title"></h2>

    <!-- 照片轮播 -->
    <div class="photo-stage">
      <button class="carousel-arrow prev" id="js-prev">‹</button>
      <div class="photo-frame" data-index="0"><img id="img-p1" alt="婚纱照1"></div>
      <div class="photo-frame active" data-index="1"><img id="img-p2" alt="婚纱照2"></div>
      <div class="photo-frame" data-index="2"><img id="img-p3" alt="婚纱照3"></div>
      <button class="carousel-arrow next" id="js-next">›</button>
    </div>
    <div class="photo-sub-title" id="js-photo-sub"></div>
    <div class="photo-desc" id="js-photo-desc"></div>

    <!-- 信笺信息卡片 -->
    <div class="letter-card">
      <img class="envlope-decor" id="js-envlope" alt="信封装饰">
      <div class="letter-content">
        <div class="letter-title" id="js-info-title"></div>
        <div class="letter-row"><span class="label">DATE</span><span id="js-info-date"></span></div>
        <div class="letter-row"><span class="label">PLACE</span><span id="js-info-place"></span></div>
        <div class="letter-row"><span class="label">CREW</span><span id="js-info-crew"></span></div>
        <button class="letter-btn" id="js-btn-text"></button>
      </div>
    </div>

    <!-- RSVP 回执表单 -->
    <div class="rsvp-container" id="rsvpContainer">
      <iframe id="rsvpIframe" class="rsvp-iframe" sandbox="allow-forms allow-scripts allow-top-navigation"></iframe>
    </div>
    <div class="fallback-tip" id="fallbackWrap">
      表单加载异常，请跳转填写回执<br>
      <button class="fallback-btn" id="openFormBtn">前往填写回执</button>
    </div>
  </main>

  <!-- 底部导航（悬浮） -->
  <nav class="bottom-nav" id="js-bottom-nav"></nav>
</div>

<!-- ===== 第二页：林间友人来信（复制第一页结构，去掉照片墙） ===== -->
<div class="page2" id="page2">
  <!-- ===== Hero（复制第一页：边框图 + 顶部小字行 + 大标题） ===== -->
  <section class="hero">
    <div class="hero-frame">
      <div class="hero-inner">
        <div class="p2-hero-title" id="js-p2-hero-title">林间友人来信</div>
      </div>
    </div>
    <div class="hero-top-row">
      <span class="hero-small-title" id="js-p2-top-small-title"></span>
      <span class="hero-date" id="js-p2-top-date"></span>
    </div>
  </section>

  <!-- ===== 主内容面板 ===== -->
  <main class="main-panel">
    <h2 class="panel-title" id="js-p2-card-title"></h2>

    <!-- 来信轮播（左侧椭圆大头像 + 信纸卡片 + 左右箭头 + 底部圆点） -->
    <div class="p2-carousel">
      <!-- 左栏：椭圆金环大头像 -->
      <div class="p2-ellipse-avatar">
        <div class="p2-ellipse-ring"></div>
        <div class="p2-ellipse-ring-inner"></div>
        <img class="p2-ellipse-img" id="js-p2-main-avatar" alt="来信者头像">
      </div>
      <!-- 右栏：信纸卡片 -->
      <div class="p2-paper-card">
        <div class="p2-paper-header">
          <div class="p2-paper-sender">
            <img class="p2-paper-avatar" id="js-p2-avatar" alt="来信头像">
            <span class="p2-paper-name" id="js-p2-name"></span>
          </div>
          <span class="p2-paper-time" id="js-p2-time"></span>
        </div>
        <div class="p2-paper-body" id="js-p2-body">
          <p class="p2-paper-text" id="js-p2-text"></p>
        </div>
      </div>
    </div>
    <div class="p2-controls">
      <button class="p2-arrow prev" id="js-p2-prev" aria-label="上一封">‹</button>
      <div class="p2-dots" id="js-p2-dots"></div>
      <button class="p2-arrow next" id="js-p2-next" aria-label="下一封">›</button>
    </div>
  </main>
</div>

<!-- ===== 第三页：婚礼日程 ===== -->
<div class="page3" id="page3">
  <!-- ===== Hero（复用前两页：边框图 + 顶部小字行 + 大标题） ===== -->
  <section class="hero">
    <div class="hero-frame">
      <div class="hero-inner">
        <div class="p2-hero-title" id="js-p3-hero-title"></div>
      </div>
    </div>
    <div class="hero-top-row">
      <span class="hero-small-title" id="js-p3-top-small-title"></span>
      <span class="hero-date" id="js-p3-top-date"></span>
    </div>
  </section>

  <!-- ===== 主内容面板 ===== -->
  <main class="main-panel">
    <h2 class="panel-title" id="js-p3-card-title"></h2>
    <div class="p3-sub" id="js-p3-sub"></div>
    <ul class="p3-schedule" id="js-p3-schedule"></ul>
  </main>
</div>

<!-- ===== 第四页：登记祝福（报名/回执入口） ===== -->
<div class="page4" id="page4">
  <!-- ===== Hero（复用前几页：边框图 + 顶部小字行 + 大标题） ===== -->
  <section class="hero">
    <div class="hero-frame">
      <div class="hero-inner">
        <div class="p2-hero-title" id="js-p4-hero-title"></div>
      </div>
    </div>
    <div class="hero-top-row">
      <span class="hero-small-title" id="js-p4-top-small-title"></span>
      <span class="hero-date" id="js-p4-top-date"></span>
    </div>
  </section>

  <!-- ===== 主内容面板 ===== -->
  <main class="main-panel">
    <h2 class="panel-title" id="js-p4-card-title"></h2>
    <div class="p3-sub" id="js-p4-sub"></div>
    <div class="p4-paper-card">
      <p class="p4-guide" id="js-p4-guide"></p>
    </div>
    <!-- 内嵌腾讯问卷 -->
    <div class="rsvp-container p4-form-wrap" id="js-p4-form-wrap">
      <iframe id="js-p4-iframe" class="rsvp-iframe" frameborder="0" allowfullscreen
        sandbox="allow-same-origin allow-scripts allow-modals allow-downloads allow-forms allow-popups"></iframe>
    </div>
    <div class="p4-closing" id="js-p4-closing"></div>
  </main>
</div>

<script src="./index.js"></script>
</body>
</html>
